name: Deploy to CyberPanel (SSH/rsync)

# Ships this repo's production files to gpli.tech's public_html/lms via
# rsync over SSH. rsync runs WITHOUT --delete on purpose — it can only
# create or update files, never remove them, so it structurally cannot wipe
# uploads/, backups/, or logs even if the exclude list below is incomplete.
# Never add --delete to this without showing the user exactly what it would
# remove.
#
# Database schema changes are NEVER part of this workflow on purpose —
# those stay manual, reviewed SQL applied by hand in phpMyAdmin, even though
# SSH access would technically make automating them possible. See
# DEPLOYMENT.md for the full policy.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 201.18.210.251 >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o LogLevel=ERROR -T -o UserKnownHostsFile=/dev/null" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.claude' \
            --exclude='node_modules' \
            --exclude='application/config/database.php' \
            --exclude='uploads/' \
            --exclude='backups/' \
            --exclude='application/logs/' \
            --exclude='*.log' \
            --exclude='*.md' \
            --exclude='docs' \
            --exclude='assets/design-system/reference' \
            --exclude='assets/design-system/dropdown-bs5-verify.html' \
            --exclude='assets/design-system/email-preview.html' \
            --exclude='geeseprojdesignsystem.html' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            --exclude='desktop.ini' \
            --exclude='certificate.zip' \
            --exclude='themes' \
            --exclude='.ftpquota' \
            ./ \
            gplit1020@201.18.210.251:/home/gpli.tech/public_html/lms/
