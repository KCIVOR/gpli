name: Auto Deploy to Production (cPanel)

# Ships this repo's production files to public_html/lms via SFTP, using
# lftp's mirror command to only upload files that are new or changed
# (compared by size/timestamp against what's already on the server) — it
# never touches anything not present locally, which is exactly why
# uploads/, backups/, application/logs/, and application/config/database.php
# are safe: they're gitignored, so this workflow has no record of them and
# can never upload over or delete them. mirror runs WITHOUT --delete on
# purpose — see the non-negotiable rule below.
#
# History of how we got to SFTP specifically:
#   - SSH/rsync (the original setup) fails because Shell Access is disabled
#     on this cPanel account: SSH auth succeeds, but command execution
#     (which `rsync --server` requires on the remote end) is rejected with
#     "Shell access is not enabled on your account!" — fatal to rsync.
#   - FTPS (SamKirkland/FTP-Deploy-Action) was tried next, but cPanel's FTP
#     daemon has a passive-mode/NAT misconfiguration: the control
#     connection stays alive while data-channel transfers silently stall,
#     so instead of failing fast the job hung for 2+ hours before erroring
#     with "Server sent FIN packet unexpectedly, closing connection."
#   - SFTP has neither problem: cPanel's SFTP subsystem runs independently
#     of the interactive-shell restriction (confirmed by testing directly),
#     and SFTP has no separate passive data channel to misconfigure — it's
#     a single persistent SSH connection for everything.
#
# Database schema changes are NEVER part of this workflow on purpose —
# those stay manual, reviewed SQL applied by hand in phpMyAdmin. See
# DEPLOYMENT.md for the full policy.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -p -m PEM -f ~/.ssh/deploy_key -N "" -q
          ssh-keyscan -H 89.116.134.177 >> ~/.ssh/known_hosts

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy to public_html/lms via SFTP
        run: |
          lftp -e "
            set sftp:connect-program 'ssh -a -x -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=~/.ssh/known_hosts';
            open -p 22 sftp://startuplabcc@89.116.134.177;
            mirror --reverse --verbose --parallel=4 \
              --exclude-glob .git* \
              --exclude-glob .github/ \
              --exclude-glob node_modules/ \
              --exclude-glob application/config/database.php \
              --exclude-glob uploads/ \
              --exclude-glob backups/ \
              --exclude-glob application/logs/ \
              --exclude-glob '*.log' \
              --exclude-glob '*.md' \
              --exclude-glob docs/ \
              --exclude-glob assets/design-system/reference/ \
              --exclude-glob assets/design-system/dropdown-bs5-verify.html \
              --exclude-glob assets/design-system/email-preview.html \
              --exclude-glob geeseprojdesignsystem.html \
              --exclude-glob .DS_Store \
              --exclude-glob Thumbs.db \
              --exclude-glob desktop.ini \
              ./ public_html/lms/;
            bye
          "
