<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin dropdown BS5 verify</title>
  <link rel="stylesheet" href="../frontend/default-new/css/bootstrap.min.css">
  <link rel="stylesheet" href="../backend/css/hyper-admin-theme.css">
  <link rel="stylesheet" href="gp-tokens.css">
  <link rel="stylesheet" href="gp-dropdown.css">
  <style>
    body.gp-ds { background: #eee; padding: 80px 24px 24px; }
    .navbar-custom { position: relative; z-index: 20; }
    #out { font-family: monospace; white-space: pre-wrap; margin-top: 120px; }
  </style>
</head>
<body class="gp-ds" data-theme="light" data-layout="detached">
  <div class="navbar-custom topnav-navbar topnav-navbar-dark">
    <ul class="list-unstyled topbar-right-menu float-right mb-0">
      <li class="dropdown notification-list">
        <a class="nav-link dropdown-toggle nav-user arrow-none mr-0" data-bs-toggle="dropdown" id="topbar-userdrop" href="#" role="button" aria-haspopup="true" aria-expanded="false">Profile</a>
        <div class="dropdown-menu dropdown-menu-right dropdown-menu-animated topbar-dropdown-menu profile-dropdown" aria-labelledby="topbar-userdrop">
          <a class="dropdown-item notify-item" href="#">My account</a>
          <a class="dropdown-item notify-item" href="#">Logout</a>
        </div>
      </li>
    </ul>
  </div>
  <div id="out">Opening profile menu…</div>
  <script src="../frontend/default-new/js/bootstrap.bundle.min.js"></script>
  <script>
    var menu = document.querySelector('.profile-dropdown');
    var toggle = document.getElementById('topbar-userdrop');
    var dd = bootstrap.Dropdown.getOrCreateInstance(toggle);
    dd.show();
    setTimeout(function () {
      var cs = getComputedStyle(menu);
      var lines = [
        'has.show: ' + menu.classList.contains('show'),
        'opacity: ' + cs.opacity,
        'visibility: ' + cs.visibility,
        'display: ' + cs.display,
        'pass: ' + (menu.classList.contains('show') && cs.opacity === '1' && cs.visibility === 'visible' && cs.display !== 'none')
      ];
      document.getElementById('out').textContent = lines.join('\n');
    }, 50);
  </script>
</body>
</html>
